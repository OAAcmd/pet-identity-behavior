name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and tests (real models)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Cache model weights (checksum-verified on use)
        uses: actions/cache@v4
        with:
          path: var/models
          key: models-${{ hashFiles('manifests/resources.json') }}
      - name: Fetch models (checksum-verified)
        run: uv run petperception fetch-models
      - name: Release gate (research profile)
        run: uv run petperception release-check
      - name: Tests
        # Tests needing ESC-50 / Open Images media skip themselves when the data is absent.
        run: uv run pytest -q
      - name: OpenAPI and result schema are current
        run: |
          uv run petperception export-openapi
          git diff --exit-code docs/openapi.json docs/analysis_result.schema.json

  web:
    name: PWA typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Container image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (not pushed)
        run: docker build -t petperception:ci .
      - name: Image starts and reports health without models
        run: |
          docker run -d --name pp -e PETPERCEPTION_CONFIG=/app/configs/production.yaml petperception:ci serve
          for i in $(seq 1 30); do
            if docker exec pp python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health').status==200 else 1)"; then break; fi
            sleep 2
          done
          docker exec pp python -c "import urllib.request,json; print(json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')))"
          docker logs pp | tail -20
          docker rm -f pp
