# Bounded CPU profile for local development (default). All paths are relative
# to the repository root unless absolute; ${VAR:-default} values are expanded
# from the environment. See docs/CONFIGURATION.md.
config_version: 2
profile: cpu
release_profile: ${PETPERCEPTION_RELEASE_PROFILE:-research}
research_profile: true

paths:
  data_root: ${PETPERCEPTION_DATA_ROOT:-var/data}
  models_root: ${PETPERCEPTION_MODELS_ROOT:-var/models}
  results_root: results
  artifacts_root: artifacts
  manifests_root: manifests
  jobs_root: ${PETPERCEPTION_JOBS_ROOT:-var/jobs}

limits:
  max_file_bytes: 209715200      # 200 MiB
  max_duration_s: 600            # 10 minutes
  max_video_frames: 1200         # sampled frames per analysis
  max_audio_channels: 8
  ffprobe_timeout_s: 30
  decode_timeout_s: 300

audio:
  enabled: true
  event_backend: yamnet
  silence_dbfs: -60
  analysis_sample_rate: 16000
  yamnet:
    model_id: yamnet_mediapipe_v1
    hop_s: 0.48
    thresholds_file: artifacts/audio_event_thresholds.json
    default_thresholds: {cat_vocalization: 0.5, dog_vocalization: 0.5, growl: 0.5}   # growl: not data-selected
    context_tag_threshold: 0.3
    min_event_gap_s: 0.5

vision:
  enabled: true
  detector: efficientdet_lite0_mediapipe_v1
  sample_fps: 2.0
  max_side: 640
  score_threshold: 0.35
  nms_iou: 0.5
  max_detections_per_frame: 10
  target_classes: [cat, dog]
  context_object_classes: []     # e.g. [person]; COCO 'bowl' is not validated for pet bowls
  camera_motion_compensation: true
  tracker: {iou_threshold: 0.3, max_gap_s: 1.5, min_hits: 2}
  quality:
    low_light_luma: 40
    blur_laplacian_var: 25
    tiny_area_fraction: 0.004
    camera_motion_threshold: 0.01
    frame_gap_factor: 2.5

pose:
  provider: none                 # no verified cat/dog pose checkpoint is available

fusion:
  mode: experimental
  method: rule_baseline          # rule_baseline | weighted_average | product_of_experts
  weights: {audio: 1.0, vision: 1.0, context: 0.5, pose: 1.0}   # NOT fitted: no paired dev data
  temperature: 2.0
  smoothing_epsilon: 0.02
  prior_logit: -1.0
  max_evidence_age_s: 10
  co_occurrence_window_s: 3.0
  min_zone_dwell_s: 1.0
  abstain_below_score: 0.5

vlm:
  enabled: false                 # optional owner-configured loopback endpoint only
  endpoint: null

serve:
  host: 127.0.0.1                # loopback by default
  port: 8000
  static_dir: web/dist           # built PWA, served from the same origin

app:
  log_format: json
  log_level: INFO
  auth:
    registration: first_user_only   # first account becomes admin; then admin-created accounts only
    cookie_secure: false            # localhost development over http; production config sets true
    session_ttl_hours: 336
    session_idle_hours: 72
    min_password_length: 10
  jobs:
    workers: 1
    lease_s: 60
    heartbeat_s: 10
    max_attempts: 3
    retry_backoff_s: 5
    job_timeout_s: 900
    max_active_per_user: 3
    max_queued_total: 50
  storage:
    database_path: ${PETPERCEPTION_DB:-var/app/petperception.sqlite3}
    media_root: ${PETPERCEPTION_MEDIA_ROOT:-var/app/media}
    max_upload_bytes: 104857600     # 100 MiB
    max_chunk_bytes: 8388608        # 8 MiB
    max_open_uploads_per_user: 5
    upload_expiry_hours: 24
    user_quota_bytes: 2147483648    # 2 GiB retained media per user
    max_retain_media_days: 30
    min_free_disk_bytes: 536870912
    cleanup_interval_s: 300

runtime:
  num_threads: 2
  accelerator: cpu
