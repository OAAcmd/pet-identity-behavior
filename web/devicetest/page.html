<title>Pet Observer Phone Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: one narrow column of numbered test steps, each a checklist row with a status chip. */
  :root {
    --bg: #f4f6f8; --surface: #ffffff; --fg: #17212b; --muted: #55626f; --line: #d6dde4;
    --accent: #1d5d8f; --accent-fg: #ffffff;
    --pass: #1f7a3f; --pass-bg: #e3f3e8; --fail: #b3261e; --fail-bg: #fbe5e3; --run: #8a5a00; --run-bg: #fdf0d5; --idle-bg: #e7ecf0;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151b; --surface: #17202a; --fg: #e5ebf1; --muted: #9aa8b5; --line: #2b3945;
      --accent: #6fb0e6; --accent-fg: #0b1620;
      --pass: #7fd39b; --pass-bg: #163222; --fail: #ff9b92; --fail-bg: #3a1916; --run: #f2c46d; --run-bg: #3a2c10; --idle-bg: #22303c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151b; --surface: #17202a; --fg: #e5ebf1; --muted: #9aa8b5; --line: #2b3945;
    --accent: #6fb0e6; --accent-fg: #0b1620;
    --pass: #7fd39b; --pass-bg: #163222; --fail: #ff9b92; --fail-bg: #3a1916; --run: #f2c46d; --run-bg: #3a2c10; --idle-bg: #22303c;
    color-scheme: dark;
  }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 40rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.2; }
  h1 { font-size: 1.75rem; }
  h2 { font-size: 1.15rem; }
  h3 { font-size: 1.02rem; }
  p { margin: 0; }
  code, .report { font-family: var(--font-mono); font-size: 0.85em; }
  .head { display: grid; gap: 8px; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.75rem; color: var(--muted); font-weight: 700; }
  .lede { max-width: 65ch; }
  .muted, .hint { color: var(--muted); font-size: 0.9rem; }
  .warn { background: var(--run-bg); color: var(--run); padding: 10px 12px; border-radius: 8px; }
  .bad { color: var(--fail); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 10px 14px; }
  label { display: grid; gap: 4px; font-size: 0.9rem; font-weight: 700; min-width: 0; }
  label.inline { font-weight: 400; }
  input, select, textarea { font: inherit; font-weight: 400; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: step; }
  .step { counter-increment: step; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
  .stephead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .stephead h3::before { content: counter(step) ". "; color: var(--muted); font-variant-numeric: tabular-nums; }
  .help { color: var(--muted); max-width: 65ch; }
  .result { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .chip { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: var(--idle-bg); color: var(--muted); white-space: nowrap; }
  .chip.passed, .chip.done { background: var(--pass-bg); color: var(--pass); }
  .chip.failed { background: var(--fail-bg); color: var(--fail); }
  .chip.running { background: var(--run-bg); color: var(--run); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { font: inherit; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; justify-self: start; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled, .btn.off { opacity: 0.45; cursor: not-allowed; }
  label.btn input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  label.btn { position: relative; display: inline-flex; }
  .progress { position: sticky; bottom: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; color: var(--accent); }
  .credits { margin: 0; padding-left: 1.1rem; display: grid; gap: 8px; overflow-wrap: anywhere; }
  .report { max-height: 22rem; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; white-space: pre; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<div id="app"><main class="wrap"><h1>Phone test</h1><p>Loading the test files…</p></main></div>
<script type="module" src="app.js"></script>
